services:
  # 1. WaterLine Backend API Service
  - type: web
    name: waterline-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22

  # 2. WaterLine Frontend Static Site
  - type: web
    name: waterline-frontend
    runtime: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        value: https://waterline-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html





