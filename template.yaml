AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  WaterLine - Hyperlocal Urban Road Hazard, Flood & Civic Escalation Telemetry
  Comprehensive AWS Multi-Service Architecture (API Gateway, Lambda, DynamoDB, Bedrock, SNS, SES, S3, EventBridge, CloudWatch)

Parameters:
  AlertEmail:
    Type: String
    Description: Real email address for Commuter Critical Hazards (confirm the AWS SNS link sent to this email).
  GovEmail:
    Type: String
    Default: ''
    Description: (Optional) PWD / Municipal Authority email for Road Defect & Pothole Cluster Escalations. Defaults to AlertEmail if left blank.
  BedrockModelId:
    Type: String
    Default: 'anthropic.claude-3-haiku-20240307-v1:0'
    Description: >
      Vision model ID (or inference profile ID) for Bedrock multimodal depth & pothole defect analysis.
      If Bedrock is unavailable, fallback analysis is automatically engaged.

Conditions:
  HasGovEmail: !Not [!Equals [!Ref GovEmail, '']]

Globals:
  Function:
    Timeout: 20
    MemorySize: 256
    Runtime: nodejs22.x
    Environment:
      Variables:
        TABLE_NAME: !Ref ReportsTable
        CRITICAL_ALERT_SNS_TOPIC_ARN: !Ref CriticalAlertsTopic
        GOV_SNS_TOPIC_ARN: !Ref GovernmentEscalationsTopic
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        EVIDENCE_BUCKET_NAME: !Ref EvidenceBucket

Resources:
  # =========================================================================
  # 1. AMAZON API GATEWAY (HTTP API v2)
  # =========================================================================
  WaterLineApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  # =========================================================================
  # 2. AMAZON DYNAMODB (Single-Table Design with TTL & GSI)
  # =========================================================================
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: type
          AttributeType: S
        - AttributeName: lastUpdatedAt
          AttributeType: N
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: TypeUpdatedIndex
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: lastUpdatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # =========================================================================
  # 3. AMAZON S3 (Civic Evidence Storage & Municipal Audit Dossiers)
  # =========================================================================
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'waterline-evidence-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # =========================================================================
  # 4. AMAZON SNS TOPICS & SUBSCRIPTIONS
  # =========================================================================
  CriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: waterline-critical-hazard-alerts

  CriticalAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CriticalAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  GovernmentEscalationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: waterline-government-pwd-escalations

  GovAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref GovernmentEscalationsTopic
      Protocol: email
      Endpoint: !If [HasGovEmail, !Ref GovEmail, !Ref AlertEmail]

  # =========================================================================
  # 5. AWS LAMBDA SERVERLESS FUNCTIONS
  # =========================================================================

  # Lambda 1: Flood Depth Estimator (Bedrock Multimodal Vision)
  AnalyzeFloodFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/analyzeFlood.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        AnalyzeApi:
          Type: HttpApi
          Properties:
            Path: /analyze
            Method: post
            ApiId: !Ref WaterLineApi

  # Lambda 2: Pothole & Road Defect Severity Analyzer (Bedrock Multimodal Vision)
  AnalyzeHazardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/analyzeHazard.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        AnalyzeHazardApi:
          Type: HttpApi
          Properties:
            Path: /analyze-hazard
            Method: post
            ApiId: !Ref WaterLineApi

  # Lambda 3: Report Ingestion & Proximity Correlation
  CreateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/createReport.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CriticalAlertsTopic.TopicName
      Events:
        CreateReportApi:
          Type: HttpApi
          Properties:
            Path: /reports
            Method: post
            ApiId: !Ref WaterLineApi

  # Lambda 4: Query Active Pins (Strict 45-Min Flood TTL Enforcement)
  GetPinsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/getPins.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
      Events:
        GetPinsApi:
          Type: HttpApi
          Properties:
            Path: /pins
            Method: get
            ApiId: !Ref WaterLineApi

  # Lambda 5: Crowd Hazard Verification & Fixed Voting
  VotePinFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/votePin.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
      Events:
        VotePinApi:
          Type: HttpApi
          Properties:
            Path: /pins/vote
            Method: post
            ApiId: !Ref WaterLineApi

  # Lambda 6: Route Pothole Cluster Aggregator & Government PWD Escalation
  EscalateRouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/escalateRoute.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt GovernmentEscalationsTopic.TopicName
        - S3CrudPolicy:
            BucketName: !Sub 'waterline-evidence-${AWS::AccountId}-${AWS::Region}'
      Events:
        EscalateRouteApi:
          Type: HttpApi
          Properties:
            Path: /routes/escalate
            Method: post
            ApiId: !Ref WaterLineApi

  # Lambda 7: Query Active Municipal Grievance Tickets
  GetEscalationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/getEscalations.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
      Events:
        GetEscalationsApi:
          Type: HttpApi
          Properties:
            Path: /routes/escalations
            Method: get
            ApiId: !Ref WaterLineApi

  # Lambda 8: EventBridge Scheduled Periodic Corridor Hazard Audit
  RouteAuditScheduledFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers/routeAuditScheduled.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt GovernmentEscalationsTopic.TopicName
      Events:
        HourlyCorridorAuditSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(2 hours)
            Description: Periodic automated road defect cluster scan and municipal grievance dispatch

Outputs:
  HttpApiUrl:
    Description: Base URL for WaterLine HTTP API Gateway
    Value: !Sub 'https://${WaterLineApi}.execute-api.${AWS::Region}.amazonaws.com'
  DynamoDBTableName:
    Description: DynamoDB Reports & Escalations Table Name
    Value: !Ref ReportsTable
  EvidenceBucketName:
    Description: S3 Evidence & Civic Audit Dossiers Bucket
    Value: !Ref EvidenceBucket
  CriticalAlertsTopicArn:
    Description: SNS Topic ARN for Critical Hazard Alerts
    Value: !Ref CriticalAlertsTopic
  GovernmentEscalationsTopicArn:
    Description: SNS Topic ARN for PWD & Municipal Road Escalations
    Value: !Ref GovernmentEscalationsTopic
